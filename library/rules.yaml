  stages: ["Вход", "Ориентация", "Выбор", "Потребление", "Действие", "Возврат"]
  screen_states: ["дефолт", "загрузка", "пусто", "ошибка загрузки", "нет сети", "нет доступа", "не найдено", "закрыто по сроку или лимиту", "устарело", "не вошёл", "холодный старт"]
