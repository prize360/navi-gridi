blocker_criteria:
  1: "вред человеку или юридический риск для компании"
  2: "часть людей не может пользоваться продуктом — WCAG 2.2 AA"
  3: "теряется введённое или незавершённая работа"
  4: "человека вводят в заблуждение или лишают равного права отказаться"
  5: "ущерб структуре, который не откатывается релизом: адреса, потерянные ссылки"

