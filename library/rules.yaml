visibility:
  - condition: "Есть страница под вопрос"
    meaning: "На вопрос клиента отвечает конкретная страница, а не раздел или лента"
    rules: [FIND-1, IA-1]
  - condition: "Ответ читается машиной"
    meaning: "Текст, цифры и таблицы — текстом в HTML, который отдаёт сервер, со структурой и разметкой типа объекта"
    rules: [FIND-2, FIND-3, FIND-4, A11Y-7]
  - condition: "Дате и цифрам можно верить"
    meaning: "Видно, когда материал проверен и кто за него отвечает; цифры совпадают с действующими условиями"
    rules: [FIND-5, FAIR-5, FAIR-6]
  - condition: "Есть постоянный адрес"
    meaning: "У объекта один адрес, переезд не рвёт ссылки из ответов"
    rules: [IA-3, IA-4]
  - condition: "Ответ ведёт дальше"
    meaning: "Со страницы есть маршрут к следующему этапу и целевому действию"
    rules: [IA-2, CLR-1]

rules:
  - id: FIND-1
    level: rule
    section: "Нас находят: поиск и нейросети"
    group: "Видимость"
    text: "Для каждого вопроса из набора замера назначена одна страница, которая на него отвечает: вопрос — в заголовке или подзаголовке, ответ — в первом абзаце под ним. У вопроса нет страницы — он записан барьером этапа «Вход»"
    patterns: ["Выбор и сравнение"]
    why: "Поиск и нейросети цитируют страницу, а не раздел. Вопрос без назначенной страницы получает ответ из чужого источника; пара «вопрос — страница» либо записана, либо нет."
  - id: FIND-2
    level: blocker
    section: "Нас находят: поиск и нейросети"
    group: "Видимость"
    text: "Условия, цифры, даты и таблицы опубликованы текстом, а не изображением. PDF и картинка — дополнение к тексту на странице, а не единственный источник"
    auto: "Изображения в материалах, похожие на таблицу или текст · PDF без текстовой версии на странице"
    wcag: ["1.4.5"]
    blocker_criteria: [2]
    patterns: ["Выбор и сравнение"]
    why: "Текст картинкой нарушает WCAG 1.4.5 и не читается скринридером, поиском и нейросетями. Условия, которые видит только глаз, для части людей и для всех машин не существуют."
  - id: FIND-3
    level: rule
    section: "Нас находят: поиск и нейросети"
    group: "Видимость"
    text: "Основной текст объекта — заголовок, ответ, условия, дата — есть в HTML, который отдаёт сервер: без выполнения скриптов и без входа. Текст в свёрнутом блоке тоже лежит в HTML, а не догружается по нажатию. Скриптом догружаются только персональные и второстепенные блоки"
    auto: "Страница запрашивается без выполнения скриптов: заголовок, ответ, условия и дата есть в HTML"
    patterns: ["Вход и доступ", "Состояния экрана"]
    why: "Краулеры крупных AI-сервисов не выполняют JavaScript: текст, собранный скриптом, для них пуст. Запрос страницы без скриптов даёт однозначный ответ."
  - id: FIND-4
    level: rule
    section: "Нас находят: поиск и нейросети"
    group: "Видимость"
    text: "У страницы объекта есть структурированная разметка его типа по schema.org: статья, мероприятие, курс, продукт, организация, хлебные крошки. Значения в разметке совпадают с видимыми на странице"
    auto: "Валидатор разметки schema.org · значения разметки совпадают с видимым текстом"
    partly_closed_by: ["Хлебные крошки"]
    patterns: ["Карточка и выдача"]
    why: "Разметка schema.org говорит машине, что это за объект, какая у него дата, цена, место. Разметка, которая расходится с видимым текстом, поисковые системы считают нарушением, поэтому сверка входит в правило."
  - id: FIND-5
    level: rule
    section: "Нас находят: поиск и нейросети"
    group: "Видимость"
    text: "Материал в теме, где условия меняются, показывает дату содержательной проверки и того, кто отвечает за содержание, — автора или подразделение. Та же дата отдана в разметке"
    auto: "У материала в теме с меняющимися условиями заполнены дата проверки и ответственный"
    why: "Человек и нейросеть выбирают свежий и подписанный источник. Дата содержательной проверки и ответственный либо показаны и размечены, либо нет."
  - id: CLR-1
    level: rule
    section: "Сквозные принципы"
    group: "Ясность"
    text: "На экране одно приоритетное действие, и оно ведёт к следующему этапу карты. Остальные действия визуально вторичны"
    patterns: ["Карточка и выдача", "Выбор и сравнение"]
    why: "Два равных действия делят внимание, и человек не делает ни одного. Число приоритетных действий на экране проверяется осмотром одинаково у любого проверяющего."
  - id: CLR-2
    level: rule
    section: "Сквозные принципы"
    group: "Ясность"
    text: "Кнопка называет результат, а не механику: «Зарегистрироваться», а не «Отправить». Одно действие называется одинаково во всём продукте — по словарю действий"
    auto: "Строки интерфейса сверяются со словарём действий: слово не из словаря — нарушение"
    patterns: ["Заявка: форма → отправка → статус"]
    why: "Разные слова человек читает как разные действия. Расхождение находится сверкой текстов со словарём, а не спором на ревью."
  - id: CLR-3
    level: blocker
    section: "Сквозные принципы"
    group: "Ясность"
    text: "Текст ошибки называет причину, а если система знает, как исправить, — и способ"
    wcag: ["3.3.3"]
    blocker_criteria: [2]
    patterns: ["Заявка: форма → отправка → статус", "Состояния экрана"]
    why: "Критерий WCAG 3.3.3. Ошибка без причины оставляет человека угадывать, и он уходит."
  - id: PRED-1
    level: rule
    section: "Сквозные принципы"
    group: "Предсказуемость"
    text: "Каждое действие даёт видимый результат: меняется сам элемент, появляется сообщение или экран результата"
    patterns: ["Заявка: форма → отправка → статус", "Состояния экрана", "Прерывание: сообщения и слои"]
    why: "Молчание интерфейса человек читает как отказ и повторяет действие. Отклик у действия либо есть, либо нет."
  - id: PRED-2
    level: blocker
    section: "Сквозные принципы"
    group: "Предсказуемость"
    text: "Повтор действия — второй клик, обновление страницы, повторный вход — не создаёт второй результат: вторую заявку, регистрацию, списание, публикацию. Лоадер на кнопке этого не обеспечивает"
    blocker_criteria: [1]
    patterns: ["Заявка: форма → отправка → статус", "Публикации и обсуждения"]
    why: "Вторая заявка, регистрация или списание — вред человеку и работа поддержке. В системе либо один объект, либо два."
  - id: PRED-3
    level: rule
    section: "Сквозные принципы"
    group: "Предсказуемость"
    text: "Возврат назад сохраняет позицию, фильтры, сортировку, введённый текст и раскрытые блоки. Поиск и фильтры отражены в адресе"
    partly_closed_by: ["Панель фильтров"]
    patterns: ["Поиск и каталог"]
    why: "Потерянное состояние — работа, которую человек делает второй раз. Выдачу без адреса нельзя переслать коллеге."
  - id: PRED-4
    level: blocker
    section: "Сквозные принципы"
    group: "Предсказуемость"
    text: "Операция с деньгами, юридическое действие и удаление данных либо обратимы, либо подтверждаются до выполнения. Обратимое даёт «Отменить», а не диалог"
    wcag: ["3.3.4"]
    blocker_criteria: [1, 2]
    patterns: ["Прерывание: сообщения и слои"]
    why: "Критерий WCAG 3.3.4 и прямая цена ошибки в деньгах. Обратимость — свойство объекта, её видно по системе."
  - id: SAFE-1
    level: blocker
    section: "Сквозные принципы"
    group: "Сохранность работы"
    text: "Введённое не теряется: при ошибке, обновлении страницы, возврате назад, истёкшей сессии и закрытии слоя. Черновик публикации и незаконченный вопрос к AI — тоже введённое"
    blocker_criteria: [3]
    partly_closed_by: ["Помощник: кнопка, подсказка в контенте, слой"]
    patterns: ["Заявка: форма → отправка → статус", "Вход и доступ", "Состояния экрана", "Публикации и обсуждения", "Ответ AI на чувствительную тему"]
    why: "Потеря введённого не компенсируется. Сценарии потери воспроизводятся за минуты."
  - id: SAFE-2
    level: blocker
    section: "Сквозные принципы"
    group: "Сохранность работы"
    text: "После входа человек возвращается к прерванному действию. Обратимое доделывается само; необратимое и то, у чего изменились условия — цена, ставка, число мест, — переспрашивается"
    blocker_criteria: [1, 3]
    patterns: ["Заявка: форма → отправка → статус", "Вход и доступ"]
    why: "Вход — пауза, а не согласие. Необратимое действие, выполненное сразу после входа, человек не подтверждал."
  - id: SAFE-3
    level: blocker
    section: "Сквозные принципы"
    group: "Сохранность работы"
    text: "Догрузка контента и раскрытие блока не сдвигают то, что человек читает, и то, куда он нажимает"
    blocker_criteria: [1]
    patterns: ["Состояния экрана"]
    why: "Сдвиг под пальцем даёт нажатие на то, что человек не выбирал; на экранах с деньгами и согласиями это прямой вред. Общий CLS этого не доказывает."
  - id: FAIR-1
    level: blocker
    section: "Сквозные принципы"
    group: "Честность"
    text: "Нет ложной срочности и дефицита: таймеров, за которыми ничего не заканчивается, «осталось 2 места» без правды. Нет предвыбранных согласий и платных опций"
    blocker_criteria: [1, 4]
    patterns: ["Прерывание: сообщения и слои", "Выбор и сравнение"]
    why: "Ложная срочность и предвыбор — обман, для компании это доверие и репутационный риск. Перечень закрытый и проверяется по списку."
  - id: FAIR-2
    level: blocker
    section: "Сквозные принципы"
    group: "Честность"
    text: "Отказ заметен так же, как согласие: та же зона, читаемый контраст. Отказ помнится: одно предложение за сессию, повторно — не раньше чем через 90 дней"
    blocker_criteria: [4]
    patterns: ["Прерывание: сообщения и слои"]
    why: "Показать то же предложение отказавшемуся — проигнорировать его ответ. Срок задан числом и проверяется данными."
  - id: FAIR-3
    level: blocker
    section: "Сквозные принципы"
    group: "Честность"
    text: "Условия, от которых зависит решение, видны до решения — не в аккордеоне, тултипе или «показать ещё». Продукт: цена, ставка, комиссия, срок, обязательства. Мероприятие: дата, время с часовым поясом, формат, место, ограничения участия. Курс: длительность, цена, условия сертификата"
    blocker_criteria: [1, 4]
    patterns: ["Заявка: форма → отправка → статус", "Выбор и сравнение", "Ответ AI на чувствительную тему"]
    why: "Спрятанное условие меняет решение о деньгах. Перечень существенных условий дают юрист и продакт, после этого проверка — осмотр."
  - id: FAIR-4
    level: blocker
    section: "Сквозные принципы"
    group: "Честность"
    text: "Метки «Реклама», «Продукт компании», возрастная, «Не является индивидуальной инвестиционной рекомендацией» стоят везде, где показан объект: страница, карточка, подборка, рекомендации, рассылка, ответ AI"
    blocker_criteria: [1]
    patterns: ["Карточка и выдача", "Выбор и сравнение", "Публикации и обсуждения", "Ответ AI на чувствительную тему"]
    why: "Закон о рекламе и возрастная маркировка действуют в каждом месте показа. Метка только на странице объекта требование не выполняет."
  - id: FAIR-5
    level: blocker
    section: "Сквозные принципы"
    group: "Честность"
    text: "Объект в теме, где условия меняются — налоги, ставки, законы, инвестиции, условия продуктов, — показывает баннер об актуальности, если с содержательной проверки прошло 12 месяцев или изменился первоисточник"
    auto: "Материал из списка тем с датой содержательной проверки старше 12 месяцев без баннера"
    blocker_criteria: [1, 4]
    patterns: ["Выбор и сравнение", "Ответ AI на чувствительную тему"]
    why: "Устаревшая цифра о налоге или ставке ведёт к решению с денежными последствиями. Об актуальности говорит дата проверки, а не возраст публикации."
  - id: FAIR-6
    level: blocker
    section: "Сквозные принципы"
    group: "Честность"
    text: "Цифра, от которой зависит решение, — ставка, цена, комиссия, результат калькулятора или подбора, цифра в ответе AI, — совпадает с действующими условиями и показывает, на какую дату и при каких допущениях посчитана"
    blocker_criteria: [1, 4]
    patterns: ["Выбор и сравнение", "Ответ AI на чувствительную тему"]
    why: "Цифра может быть неверной даже с источником и датой, и такой ответ опаснее всего: он выглядит проверенным. Совпадение с действующими условиями проверяется сверкой."
  - id: FAIR-7
    level: blocker
    section: "Сквозные принципы"
    group: "Честность"
    text: "Если подходящего варианта или данных нет, подбор и AI так и говорят и дают маршрут — к специалисту, к общему списку, к первоисточнику, — а не подставляют ближайшее"
    blocker_criteria: [1, 4]
    patterns: ["Выбор и сравнение", "Ответ AI на чувствительную тему"]
    why: "Отказ — нормальный результат подбора и помощника. Правдоподобная подстановка, за которую никто не отвечает, — вред с денежными последствиями."
  - id: PRIV-1
    level: blocker
    section: "Сквозные принципы"
    group: "Приватность"
    text: "Данные и разрешения запрашиваются в момент, когда нужны, и с пользой, которую человек видит до запроса. Пакетный запрос на входе запрещён"
    blocker_criteria: [1]
    patterns: ["Заявка: форма → отправка → статус", "Вход и доступ"]
    why: "Согласие, полученное до того, как человек понял, на что соглашается, слабое юридически и нечестное по существу."
  - id: PRIV-2
    level: blocker
    section: "Сквозные принципы"
    group: "Приватность"
    text: "Внутренняя классификация — сегмент, скоринг, источник трафика — не показывается человеку. В события аналитики не уходят ни она, ни содержимое полей"
    blocker_criteria: [1]
    why: "Человек не соглашался быть размеченным, а сегмент в событиях — персональные данные в чужой системе."
  - id: PRIV-3
    level: blocker
    section: "Сквозные принципы"
    group: "Приватность"
    text: "Согласия раздельные и не предвыбраны: регистрация отдельно, рассылка отдельно. Каналы — почта, пуш, SMS — и темы уведомлений включаются по отдельности. Отписка — одним действием из самого сообщения"
    blocker_criteria: [1, 4]
    patterns: ["Заявка: форма → отправка → статус", "Вход и доступ"]
    why: "Требование закона. Проверяется юридической сверкой и прогоном, а не обсуждением."
  - id: PRIV-4
    level: blocker
    section: "Сквозные принципы"
    group: "Приватность"
    text: "Выход, очистка истории, удаление своих публикаций и аккаунта доступны из интерфейса и объясняют, что именно исчезнет"
    blocker_criteria: [1]
    partly_closed_by: ["Меню профиля"]
    patterns: ["Вход и доступ", "Публикации и обсуждения"]
    why: "Право на свои данные без интерфейса существует только на бумаге."
  - id: PRIV-5
    level: blocker
    section: "Сквозные принципы"
    group: "Приватность"
    text: "На публичной странице — профиль, сертификат, страница спикера, публикация в сообществе — только то, что человек опубликовал сам или разрешил показать. Состав полей назван в задаче и согласован"
    blocker_criteria: [1]
    patterns: ["Публикации и обсуждения"]
    why: "Публичная страница видна поиску и нейросетям и не забывается после удаления. Показанное без разрешения не возвращается."
  - id: A11Y-1
    level: blocker
    section: "Сквозные принципы"
    group: "Доступность"
    text: "Всё доступно с клавиатуры: порядок фокуса совпадает с визуальным, фокус видим и не перекрыт липкими элементами, ловушек нет. Слой закрывается по Esc и возвращает фокус туда, откуда его открыли"
    wcag: ["2.1.1", "2.1.2", "2.4.3", "2.4.7", "2.4.11"]
    blocker_criteria: [2]
    partly_closed_by: ["Меню разделов", "Навигация промо", "Оглавление с якорями", "Меню профиля", "Тост, диалог, шторка", "Поле поиска", "Помощник: кнопка, подсказка в контенте, слой"]
    patterns: ["Заявка: форма → отправка → статус", "Прерывание: сообщения и слои", "Поиск и каталог"]
    why: "Критерии WCAG. Клавиатурный прогон занимает минуты и ловит больше, чем сканер."
  - id: A11Y-2
    level: blocker
    section: "Сквозные принципы"
    group: "Доступность"
    text: "Контраст текста ≥ 4.5:1, крупного текста и границ элементов управления ≥ 3:1. Текст, объясняющий недоступность, — тоже ≥ 4.5:1"
    auto: "Пары цветов текста и фона, границ и фона — в макете и на сборке"
    wcag: ["1.4.3", "1.4.11"]
    blocker_criteria: [2]
    closed_by: ["Хедер", "Подвал", "Поле формы"]
    why: "Критерии WCAG. Считается по паре цветов, спорить не о чем."
  - id: A11Y-3
    level: blocker
    section: "Сквозные принципы"
    group: "Доступность"
    text: "Зона нажатия ≥ 24×24 CSS px — меньше 24 недопустимо. Рекомендуем 44×44: видимая кнопка может быть меньше, если невидимая зона добирает размер"
    auto: "Размер зоны нажатия у интерактивных элементов"
    wcag: ["2.5.8"]
    blocker_criteria: [2]
    closed_by: ["Хедер", "Таббар", "Навигация промо", "Кнопка помощи", "Карточка объекта", "Тег и бейдж", "Приоритетное действие", "Липкая панель"]
    why: "Стандарт требует 24 px — это граница блокера. 44 px рекомендуем: на мобильном промах по кнопке с деньгами стоит денег, но мелкая иконка с невидимой зоной 24 px правило не нарушает."
  - id: A11Y-4
    level: blocker
    section: "Сквозные принципы"
    group: "Доступность"
    text: "Информация не передаётся только цветом: тип сообщения, ошибка, недоступность, различие тега и бейджа несут ещё текст, иконку или форму"
    wcag: ["1.4.1"]
    blocker_criteria: [2]
    closed_by: ["Тег и бейдж", "Группа бейджей", "Статус заявки", "Тост, диалог, шторка"]
    patterns: ["Состояния экрана", "Карточка и выдача"]
    why: "Критерий WCAG 1.4.1. Проверяется скриншотом в градациях серого."
  - id: A11Y-5
    level: blocker
    section: "Сквозные принципы"
    group: "Доступность"
    text: "У каждого элемента управления есть доступное имя. Иконка вне общепринятых — поиск, профиль, меню, закрыть, поделиться — ещё и с видимой подписью"
    wcag: ["4.1.2"]
    blocker_criteria: [2]
    closed_by: ["Хедер", "Меню разделов", "Таббар", "Навигация промо", "Кнопка помощи", "Карточка объекта", "Приоритетное действие", "Меню профиля", "Поле формы", "Поле поиска"]
    patterns: ["Заявка: форма → отправка → статус"]
    why: "Элемент без доступного имени для скринридера не существует."
  - id: A11Y-6
    level: blocker
    section: "Сквозные принципы"
    group: "Доступность"
    text: "Изменение состояния объявляется скринридеру: подтверждение — role=\"status\", ошибка — role=\"alert\". Ответ AI — aria-live=\"polite\" по мере готовности, а не посимвольно"
    wcag: ["4.1.3"]
    blocker_criteria: [2]
    closed_by: ["Тост, диалог, шторка", "Помощник: кнопка, подсказка в контенте, слой"]
    patterns: ["Состояния экрана", "Прерывание: сообщения и слои", "Ответ AI на чувствительную тему"]
    why: "Сообщение, которое видно только глазами, для части людей не происходит."
  - id: A11Y-7
    level: blocker
    section: "Сквозные принципы"
    group: "Доступность"
    text: "Структура передана разметкой: заголовки по уровням, списки, таблицы с заголовками, язык страницы, ссылка «Перейти к содержимому». У смыслового изображения осмысленный alt, у декоративного пустой. У видео субтитры, у аудио расшифровка"
    auto: "axe: заголовки, списки, таблицы, язык, alt, ссылка к содержимому"
    wcag: ["1.1.1", "1.2.2", "1.2.3", "1.3.1", "2.4.1", "3.1.1"]
    blocker_criteria: [2]
    why: "Разметку ловит автопрогон. Та же структура нужна поиску и нейросетям, чтобы понять страницу."
  - id: A11Y-8
    level: blocker
    section: "Сквозные принципы"
    group: "Доступность"
    text: "При увеличении текста до 200% и ширине 320 px ничего не обрезается, не накладывается и не требует горизонтального скролла. Исключение — таблицы данных, схемы, код"
    wcag: ["1.4.4", "1.4.10", "1.4.12"]
    blocker_criteria: [2]
    patterns: ["Выбор и сравнение"]
    why: "Увеличение текста и узкая ширина проваливаются по отдельности, поэтому проверяются обе."
  - id: A11Y-9
    level: blocker
    section: "Сквозные принципы"
    group: "Доступность"
    text: "Подсказка по наведению или фокусу — тултип, поповер — открывается и с клавиатуры, не исчезает при переводе курсора на неё и закрывается по Esc"
    wcag: ["1.4.13"]
    blocker_criteria: [2]
    patterns: ["Прерывание: сообщения и слои"]
    why: "Подсказка, которая гаснет при попытке её прочитать, недоступна людям с тремором и при увеличении — им она нужнее всего."
  - id: A11Y-10
    level: blocker
    section: "Сквозные принципы"
    group: "Доступность"
    text: "Помощь — чат, телефон, вопросы и ответы — стоит в одном и том же месте на всех страницах, где она есть"
    wcag: ["3.2.6"]
    blocker_criteria: [2]
    closed_by: ["Кнопка помощи"]
    why: "Критерий WCAG 3.2.6: помощь, которая каждый раз в новом месте, для части людей не находится."
  - id: A11Y-11
    level: blocker
    section: "Сквозные принципы"
    group: "Доступность"
    text: "Всё, что делается перетаскиванием, — слайдер калькулятора, сортировка, загрузка файла — делается и без него: полем ввода, кнопками или выбором"
    wcag: ["2.5.7"]
    blocker_criteria: [2]
    patterns: ["Выбор и сравнение"]
    why: "Критерий WCAG 2.5.7: перетаскивание недоступно части людей, а слайдер калькулятора бывает единственным путём к цифре."
  - id: MOT-1
    level: rule
    section: "Сквозные принципы"
    group: "Движение"
    text: "Длительность и кривая — из токенов. Анимация прерывается, элемент нажимается с первого кадра, сценарий проходится с выключенным движением, при prefers-reduced-motion движение заменяется мгновенной сменой состояния"
    auto: "Длительности и кривые вне токенов · прогон с prefers-reduced-motion"
    closed_by: ["Липкая панель"]
    patterns: ["Прерывание: сообщения и слои"]
    why: "Все пункты проверяются механически. Не блокер: отключение движения — уровень AAA, отступление возможно строкой."
  - id: MOT-2
    level: blocker
    section: "Сквозные принципы"
    group: "Движение"
    text: "Ничего не мигает чаще трёх раз в секунду"
    wcag: ["2.3.1"]
    blocker_criteria: [1, 2]
    why: "Мигание чаще трёх раз в секунду — критерий WCAG уровня A и прямой вред здоровью."
  - id: IA-1
    level: rule
    section: "Сквозные принципы"
    group: "Структура и адреса"
    text: "У каждого раздела записан набор намерений, на которые он отвечает, и у соседних разделов наборы не пересекаются. Названия разделов — из этих намерений, а не из оргструктуры и не маркетинговые"
    patterns: ["Поиск и каталог"]
    why: "Пересечение разделов не чинится дизайном карточек — только перестройкой структуры. Запись набора намерений превращает спор о названии в сверку двух списков."
  - id: IA-2
    level: rule
    section: "Сквозные принципы"
    group: "Структура и адреса"
    text: "Страница объекта отвечает на три вопроса: где я — положение в структуре, что это — заголовок, куда дальше — хотя бы один маршрут"
    why: "Человек приходит из поиска, нейросети и мессенджера в середину структуры. Три элемента либо есть на экране, либо нет."
  - id: IA-3
    level: blocker
    section: "Сквозные принципы"
    group: "Структура и адреса"
    text: "У объекта один канонический адрес и один канонический раздел. Показ в подборках, темах и рекомендациях дублем не считается"
    auto: "Объекты с двумя разделами или двумя адресами · сверка rel=canonical"
    blocker_criteria: [5]
    patterns: ["Карточка и выдача", "Ответ AI на чувствительную тему"]
    why: "Дубль расходится сам, делит ссылки и цитаты между двумя адресами и чинится разбором контента, а не правкой макета."
  - id: IA-4
    level: blocker
    section: "Сквозные принципы"
    group: "Структура и адреса"
    text: "Перенос и объединение дают 301 на релевантный адрес. Удаление без замены — 410 и страница с маршрутом дальше. Редирект на «что-нибудь похожее» запрещён"
    auto: "Изменённые адреса из журнала CMS запрашиваются заново: ответ 301 на релевантный адрес или 410"
    blocker_criteria: [5]
    patterns: ["Состояния экрана"]
    why: "Ссылка уже разослана, сохранена и процитирована в ответах нейросетей. Переходы и доверие, потерянные за время ошибки, не возвращаются."
  - id: IA-5
    level: rule
    section: "Сквозные принципы"
    group: "Структура и адреса"
    text: "Хлебные крошки показывают каноническую иерархию, а не путь входа, и строятся автоматически. На первом уровне не показываются. Текущей страницы в крошках нет: последний элемент — родитель, название страницы — в заголовке и в липкой панели"
    auto: "Цепочка крошек на странице сравнивается с путём объекта в CMS"
    closed_by: ["Хлебные крошки", "Липкая панель"]
    patterns: ["Карточка и выдача"]
    why: "Ручные крошки расходятся с CMS. Автосборка делает соблюдение бесплатным, а нарушение — видимым. Текущая страница в крошках дублирует заголовок под ними; её название держит липкая панель."
  - id: FORM-1
    level: blocker
    section: "Сквозные паттерны"
    group: "Заявка: форма → отправка → статус"
    text: "Подпись поля видна во время ввода — плейсхолдер вместо подписи запрещён. Обязательность и формат названы до ввода, а не в тултипе"
    wcag: ["3.3.2"]
    blocker_criteria: [2]
    partly_closed_by: ["Поле формы"]
    patterns: ["Заявка: форма → отправка → статус"]
    why: "Критерий WCAG 3.3.2. Человек, не знающий формата до ввода, узнаёт его из ошибки — это и есть нарушение."
  - id: FORM-2
    level: blocker
    section: "Сквозные паттерны"
    group: "Заявка: форма → отправка → статус"
    text: "Ошибка показана у поля текстом, а не только цветом, и связана с полем в разметке"
    wcag: ["3.3.1"]
    blocker_criteria: [2]
    partly_closed_by: ["Поле формы"]
    patterns: ["Заявка: форма → отправка → статус"]
    why: "Критерий WCAG 3.3.1. Ошибка, о которой говорит только цвет рамки, для части людей не существует."
  - id: FORM-3
    level: blocker
    section: "Сквозные паттерны"
    group: "Заявка: форма → отправка → статус"
    text: "У полей о человеке задан autocomplete: автозаполнение и менеджер паролей работают, маска не ломает вставку. Код из SMS вставляется из буфера и подставляется автоматически"
    wcag: ["1.3.5", "3.3.8"]
    blocker_criteria: [2, 3]
    patterns: ["Заявка: форма → отправка → статус", "Вход и доступ"]
    why: "Критерии WCAG 1.3.5 и 3.3.8. Вход, требующий перепечатать код руками, — нарушение; сломанная вставка проверяется за минуту."
  - id: FORM-4
    level: blocker
    section: "Сквозные паттерны"
    group: "Заявка: форма → отправка → статус"
    text: "Введённое раньше в этом же процессе или уже известное системе не спрашивается снова: подставлено, доступно для выбора или показано только для чтения"
    wcag: ["3.3.7"]
    blocker_criteria: [2, 3]
    patterns: ["Заявка: форма → отправка → статус", "Вход и доступ"]
    why: "Критерий WCAG 3.3.7. Повторный ввод для человека с когнитивными ограничениями или трудностями набора — стена."
  - id: FORM-5
    level: rule
    section: "Сквозные паттерны"
    group: "Заявка: форма → отправка → статус"
    text: "Статус заявки или регистрации и следующий шаг доступны после ухода с экрана результата — в профиле и в письме"
    closed_by: ["Статус заявки"]
    patterns: ["Заявка: форма → отправка → статус"]
    why: "Статус, который есть только на экране результата, исчезает вместе с ним, и человек идёт в поддержку. В профиле и в письме статус либо есть, либо нет."
  - id: AUTH-1
    level: rule
    section: "Сквозные паттерны"
    group: "Вход и доступ"
    text: "Всё, что можно без аккаунта, доступно без него. Стена только там, где без аккаунта функция невозможна: заявка, регистрация, прогресс курса, публикация, личные подборки"
    patterns: ["Вход и доступ"]
    why: "Стена выгодна в моменте и проигрывает вдолгую: человек, не увидевший ценности, не возвращается, а закрытое от гостя закрыто и от поиска."
  - id: AUTH-2
    level: rule
    section: "Сквозные паттерны"
    group: "Вход и доступ"
    text: "Вход просим в момент действия, и перед ним одна строка о том, что человек получит"
    patterns: ["Вход и доступ"]
    why: "«Войдите, чтобы продолжить» без объяснения — частая причина ухода на входе. Строка пользы либо есть, либо нет."
  - id: STATE-1
    level: rule
    section: "Сквозные паттерны"
    group: "Состояния экрана"
    text: "Для шаблона заполнена матрица состояний: каждое спроектировано или вычеркнуто с причиной. Пустое состояние и «не найдено» дают следующий шаг"
    patterns: ["Состояния экрана", "Поиск и каталог"]
    why: "Без списка проектируется несколько состояний из одиннадцати, остальные всплывают на тестировании или после релиза."
  - id: STATE-2
    level: rule
    section: "Сквозные паттерны"
    group: "Состояния экрана"
    text: "Недоступное действие объясняет, чего не хватает. Если причина не видна на экране, элемент остаётся доступен с клавиатуры и помечен aria-disabled, а не выключен атрибутом disabled"
    patterns: ["Состояния экрана"]
    why: "Серая кнопка без причины — тупик. Элемент, выключенный атрибутом, для скринридера неотличим от отсутствующего."
  - id: STATE-3
    level: blocker
    section: "Сквозные паттерны"
    group: "Состояния экрана"
    text: "Ошибка и отказ не исчезают по таймеру: их закрывает человек или они уходят, когда причина исправлена"
    blocker_criteria: [4]
    patterns: ["Состояния экрана", "Прерывание: сообщения и слои", "Публикации и обсуждения"]
    why: "Исчезнувшее сообщение об отказе читается как успех, и человек уходит уверенным, что действие выполнено."
  - id: MODA-1
    level: rule
    section: "Сквозные паттерны"
    group: "Прерывание: сообщения и слои"
    text: "Контейнер выбран по таблице. Слой открывается только в ответ на действие человека — кроме критического системного сообщения, закрывается минимум двумя способами и не открывается поверх другого слоя"
    patterns: ["Прерывание: сообщения и слои"]
    why: "Триггер, способы выхода и глубина слоя проверяются осмотром и дают одинаковый ответ у любого проверяющего."
  - id: MODA-2
    level: blocker
    section: "Сквозные паттерны"
    group: "Прерывание: сообщения и слои"
    text: "То, что можно отменить в тосте, можно вернуть и позже из интерфейса: «Отменить» в тосте — не единственный способ"
    wcag: ["2.2.1"]
    blocker_criteria: [2]
    patterns: ["Прерывание: сообщения и слои"]
    why: "Критерий WCAG 2.2.1. Тост уносит возможность по таймеру: кто не успел заметить, теряет её."
  - id: SEAR-1
    level: rule
    section: "Сквозные паттерны"
    group: "Поиск и каталог"
    text: "Нулевая выдача называет причину и даёт исправление опечатки, снятие фильтров и другой маршрут"
    patterns: ["Поиск и каталог"]
    why: "Ноль результатов без выхода — конец сессии. Элементы нулевой выдачи либо есть на экране, либо нет."
  - id: SEAR-2
    level: rule
    section: "Сквозные паттерны"
    group: "Поиск и каталог"
    text: "Применённые фильтры видны и снимаются по одному, есть «Сбросить всё». Значения, дающие ноль результатов, отключены или помечены"
    closed_by: ["Панель фильтров"]
    patterns: ["Поиск и каталог"]
    why: "Невидимый применённый фильтр — источник обращений «у вас ничего нет»."
  - id: CARD-1
    level: rule
    section: "Сквозные паттерны"
    group: "Карточка и выдача"
    text: "Состав карточки одного типа объекта одинаков во всех местах показа"
    patterns: ["Карточка и выдача", "Поиск и каталог", "Выбор и сравнение"]
    why: "Объект показывается в нескольких местах, а правится обычно одно. Расхождение видно сверкой."
  - id: CARD-2
    level: rule
    section: "Сквозные паттерны"
    group: "Карточка и выдача"
    text: "Сущности из таблицы не смешиваются в одном виде: бейдж некликабелен и отличается от тега не только цветом. Тег ведёт на адрес подборки, а не на заполненный поиск"
    partly_closed_by: ["Тег и бейдж"]
    patterns: ["Карточка и выдача"]
    why: "Смешение ломает ожидание выдачи — что кликабельно и куда ведёт. Клик по некликабельной метке читается как поломка."
  - id: CHOICE-1
    level: rule
    section: "Сквозные паттерны"
    group: "Выбор и сравнение"
    text: "У каждого варианта написано, в какой ситуации он подходит. Признаки, по которым выбирают, одинаковы и идут в одном порядке у всех вариантов"
    patterns: ["Выбор и сравнение"]
    why: "Человек знает свою ситуацию, а не названия вариантов. Разные признаки у вариантов делают сравнение невозможным."
  - id: POST-1
    level: blocker
    section: "Сквозные паттерны"
    group: "Публикации и обсуждения"
    text: "На любую чужую публикацию и сообщение можно пожаловаться за одно-два действия. После отправки человек видит, что жалоба принята"
    blocker_criteria: [1]
    patterns: ["Публикации и обсуждения"]
    why: "Без жалобы вред от чужой публикации остаётся на площадке. Пункт в меню либо есть, либо нет."
  - id: POST-2
    level: rule
    section: "Сквозные паттерны"
    group: "Публикации и обсуждения"
    text: "Автор видит статус своей публикации — на модерации, опубликована, скрыта — и причину, если её скрыли"
    patterns: ["Публикации и обсуждения"]
    why: "Публикация, исчезнувшая без объяснения, читается как сбой, и человек публикует её снова."
  - id: POST-3
    level: blocker
    section: "Сквозные паттерны"
    group: "Публикации и обсуждения"
    text: "До отправки видно, кто увидит публикацию: сообщество, группа или все в интернете"
    blocker_criteria: [1, 4]
    patterns: ["Публикации и обсуждения"]
    why: "Человек, не знавший, что пишет для всего интернета, не может это отменить: поиск и нейросети уже прочитали."
  - id: AI-1
    level: blocker
    section: "Сквозные паттерны"
    group: "Ответ AI на чувствительную тему"
    text: "Ответ на чувствительную тему называет источник и его дату"
    blocker_criteria: [1]
    patterns: ["Ответ AI на чувствительную тему"]
    why: "Ответ о деньгах без источника и даты нельзя проверить ни человеку, ни нам."
  - id: AI-2
    level: blocker
    section: "Сквозные паттерны"
    group: "Ответ AI на чувствительную тему"
    text: "Метка «Не является индивидуальной инвестиционной рекомендацией» стоит в теле ответа, а не внизу, и в ответе есть переход к первоисточнику или специалисту"
    blocker_criteria: [1]
    patterns: ["Ответ AI на чувствительную тему"]
    why: "Требование к форме раскрытия: метка в подвале ответа раскрытием не считается."
